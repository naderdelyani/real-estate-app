name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY:   ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/real-estate-app

jobs:
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - { name: frontend,             context: ./frontend }
          - { name: auth-service,         context: ./services/auth-service }
          - { name: property-service,     context: ./services/property-service }
          - { name: search-service,       context: ./services/search-service }
          - { name: notification-service, context: ./services/notification-service }

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=prod-
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.service.context }}
          target:     production
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=prod-${{ matrix.service.name }}
          cache-to:   type=gha,scope=prod-${{ matrix.service.name }},mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/real-estate-app
            git pull origin main
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml run --rm property-service npx prisma migrate deploy

      - name: Rolling deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/real-estate-app
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag:   v${{ github.run_number }}
          name:  Release v${{ github.run_number }}
          body:  "Deployed commit: ${{ github.sha }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Deployment failed for ${{ github.sha }} — investigate before re-deploying" >&2
