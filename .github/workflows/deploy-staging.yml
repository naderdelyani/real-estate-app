name: Deploy to Dev Server

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: [self-hosted, dev]
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        working-directory: /opt/real-estate-app
        run: |
          git fetch origin develop
          git reset --hard origin/develop

      - name: Start services
        working-directory: /opt/real-estate-app
        run: |
          docker compose -f docker-compose.yml up -d --build

      - name: Verify containers
        working-directory: /opt/real-estate-app
        run: |
          sleep 10
          docker compose ps
          docker compose ps | grep -v "Exit" | grep -c "Up" || true

      - name: Health check
        run: |
          for i in {1..5}; do
            curl -sf http://localhost:80/health && echo "✅ NGINX OK" && break
            echo "Retry $i/5..."
            sleep 5
          done

      - name: Cleanup old images
        run: docker system prune -f
