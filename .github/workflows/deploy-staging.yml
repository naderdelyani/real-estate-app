name: Deploy to Dev Server

on:
  push:
    branches: [develop]

env:
  PROXY: http://10.10.5.30:10809
  NO_PROXY: localhost,127.0.0.1,10.10.0.0/16

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: [self-hosted, dev]
    environment: development
    env:
      http_proxy: http://10.10.5.30:10809
      https_proxy: http://10.10.5.30:10809
      HTTP_PROXY: http://10.10.5.30:10809
      HTTPS_PROXY: http://10.10.5.30:10809
      no_proxy: localhost,127.0.0.1,10.10.0.0/16
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        working-directory: /opt/real-estate-app
        run: |
          git -c http.proxy=$HTTP_PROXY fetch origin develop
          git reset --hard origin/develop

      - name: Build services with proxy
        working-directory: /opt/real-estate-app
        run: |
          docker compose -f docker-compose.yml build \
            --build-arg http_proxy=$HTTP_PROXY \
            --build-arg https_proxy=$HTTPS_PROXY \
            --build-arg HTTP_PROXY=$HTTP_PROXY \
            --build-arg HTTPS_PROXY=$HTTPS_PROXY \
            --build-arg no_proxy=$no_proxy

      - name: Start services
        working-directory: /opt/real-estate-app
        run: docker compose -f docker-compose.yml up -d

      - name: Verify containers
        working-directory: /opt/real-estate-app
        run: |
          sleep 10
          docker compose ps
          docker compose ps | grep -c "Up" || true

      - name: Health check
        run: |
          for i in {1..5}; do
            curl -sf http://localhost:80/health && echo "✅ NGINX OK" && break
            echo "Retry $i/5..."
            sleep 5
          done

      - name: Cleanup old images
        run: docker system prune -f
