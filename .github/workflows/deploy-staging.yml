name: Deploy to Dev Server

on:
  push:
    branches: [develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            services/auth-service/package.json
            services/property-service/package.json

      - name: Test Auth Service
        working-directory: services/auth-service
        run: |
          npm ci
          npm test --if-present

      - name: Test Property Service
        working-directory: services/property-service
        run: |
          npm ci
          npm test --if-present

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Search Service
        working-directory: services/search-service
        run: |
          pip install -r requirements.txt
          pytest --if-no-tests=warn

      - name: Test Notification Service
        working-directory: services/notification-service
        run: |
          pip install -r requirements.txt
          pytest --if-no-tests=warn

  deploy:
    name: Deploy to Dev
    runs-on: [self-hosted, dev]
    needs: test
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        working-directory: /opt/real-estate-app
        run: |
          git fetch origin develop
          git reset --hard origin/develop

      - name: Start services
        working-directory: /opt/real-estate-app
        run: |
          docker compose -f docker-compose.yml up -d --build

      - name: Verify containers
        working-directory: /opt/real-estate-app
        run: |
          sleep 10
          docker compose ps
          docker compose ps | grep -v "Exit" | grep -c "Up" || true

      - name: Health check
        run: |
          for i in {1..5}; do
            curl -sf http://localhost:3000/health && echo "✅ Frontend OK" && break
            echo "Retry $i/5..."
            sleep 5
          done

      - name: Cleanup old images
        run: docker system prune -f
